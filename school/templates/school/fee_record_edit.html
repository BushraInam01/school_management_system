{% extends "school/base.html" %}

{% block title %}Edit Fee Record{% endblock %}

{% block content %}
    <h1>Edit Fee Record</h1>

    <p>Student: {{ fee_record.student }}</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}
        {{ form.errors }}

        <button type="submit">Update Fee Record</button>
    </form>

    <br>

    <a href="{% url 'fee_record_list' %}">
        Back to Fee Records
    </a>
{% endblock %}
